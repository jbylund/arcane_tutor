name: JS Tests

on:
  push:
    branches:
      - main
  # Deliberately NO `paths:` filter — see .github/scripts/changed-paths.sh. This
  # workflow always runs so its check is reported exactly once; the `changes` job
  # decides whether the real work happens.
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Does this change touch JS?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/scripts/changed-paths.sh
          '\.js$|^api/static/fixtures/|^package(-lock)?\.json$|^\.github/(workflows/js-tests\.yml|scripts/changed-paths\.sh)$'

  js-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run jest
        run: npx jest
